<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" role="img" aria-labelledby="t d" width="100%" preserveAspectRatio="xMidYMid meet">
<title id="t">Fluxograma de decisão do docente perante a IA</title>
<desc id="d">Três perguntas sucessivas conduzem a uma de três modalidades: proibida, condicionada ou livre. Todas exigem comunicação, equidade, transparência e supervisão humana.</desc>
<defs><marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#14213D"/></marker></defs>
<rect width="900" height="1180" fill="#FFFFFF"/>
<rect width="900" height="96" fill="#8A1220"/><text x="450.0" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="450.0" dy="0">Decisão do docente perante a IA</tspan></text><text x="450.0" y="76" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#F2C230" text-anchor="middle"><tspan x="450.0" dy="0">Qual a modalidade de utilização desta atividade?</tspan></text><rect x="160" y="120" width="340" height="56" rx="14" fill="#14213D" stroke="#14213D" stroke-width="2.5"/><text x="330.0" y="143.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="330.0" dy="0">Atividade de ensino ou</tspan><tspan x="330.0" dy="23.75">avaliação</tspan></text><line x1="330" y1="176" x2="330" y2="214" stroke="#14213D" stroke-width="3" marker-end="url(#seta)"/><rect x="80" y="214" width="500" height="120" rx="14" fill="#FFF9E8" stroke="#14213D" stroke-width="2.5"/><text x="330.0" y="259.125" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="330.0" dy="0">1. A competência tem de ser demonstrada de forma</tspan><tspan x="330.0" dy="21.25">autónoma, sem mediação tecnológica? (ex.: anamnese,</tspan><tspan x="330.0" dy="21.25">exame objetivo, raciocínio diagnóstico de base)</tspan></text><line x1="580" y1="274" x2="640" y2="274" stroke="#14213D" stroke-width="3" marker-end="url(#seta)"/><text x="592" y="264" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="592" dy="0">SIM</tspan></text><rect x="640" y="224" width="230" height="100" rx="14" fill="#F9D6D9" stroke="#8A1220" stroke-width="2.5"/><text x="755.0" y="260.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A1220" text-anchor="middle"><tspan x="755.0" dy="0">🔴 UTILIZAÇÃO PROIBIDA —</tspan><tspan x="755.0" dy="20.0">fundamentar e comunicar</tspan><tspan x="755.0" dy="20.0">antecipadamente</tspan></text><line x1="330" y1="334" x2="330" y2="380" stroke="#14213D" stroke-width="3" marker-end="url(#seta)"/><text x="340" y="364" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="340" dy="0">NÃO</tspan></text><rect x="80" y="380" width="500" height="120" rx="14" fill="#FFF9E8" stroke="#14213D" stroke-width="2.5"/><text x="330.0" y="435.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="330.0" dy="0">2. A tarefa envolve dados de doentes, informação</tspan><tspan x="330.0" dy="21.25">confidencial ou investigação não publicada?</tspan></text><line x1="580" y1="440" x2="640" y2="440" stroke="#14213D" stroke-width="3" marker-end="url(#seta)"/><text x="592" y="430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="592" dy="0">SIM</tspan></text><rect x="640" y="380" width="230" height="130" rx="14" fill="#FFE9A8" stroke="#14213D" stroke-width="2.5"/><text x="755.0" y="413.125" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="755.0" dy="0">Só com ferramenta</tspan><tspan x="755.0" dy="18.75">institucional (Copilot,</tspan><tspan x="755.0" dy="18.75">IAEDU) e dados</tspan><tspan x="755.0" dy="18.75">anonimizados; caso</tspan><tspan x="755.0" dy="18.75">contrário, não usar IA</tspan></text><line x1="330" y1="500" x2="330" y2="546" stroke="#14213D" stroke-width="3" marker-end="url(#seta)"/><text x="340" y="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="340" dy="0">NÃO</tspan></text><rect x="80" y="546" width="500" height="120" rx="14" fill="#FFF9E8" stroke="#14213D" stroke-width="2.5"/><text x="330.0" y="591.125" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="330.0" dy="0">3. Usar IA faz parte da competência a desenvolver</tspan><tspan x="330.0" dy="21.25">ou a avaliar? (ex.: auditar respostas de IA,</tspan><tspan x="330.0" dy="21.25">desenho de prompts)</tspan></text><line x1="580" y1="606" x2="640" y2="606" stroke="#14213D" stroke-width="3" marker-end="url(#seta)"/><text x="592" y="596" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="592" dy="0">SIM</tspan></text><rect x="640" y="556" width="230" height="100" rx="14" fill="#DDF3E4" stroke="#0B5D2A" stroke-width="2.5"/><text x="755.0" y="582.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B5D2A" text-anchor="middle"><tspan x="755.0" dy="0">🟢 UTILIZAÇÃO LIVRE — a</tspan><tspan x="755.0" dy="20.0">IA é objeto de</tspan><tspan x="755.0" dy="20.0">avaliação; exige</tspan><tspan x="755.0" dy="20.0">declaração</tspan></text><line x1="330" y1="666" x2="330" y2="712" stroke="#14213D" stroke-width="3" marker-end="url(#seta)"/><text x="340" y="696" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="340" dy="0">NÃO</tspan></text><rect x="80" y="712" width="500" height="100" rx="14" fill="#FFE9A8" stroke="#14213D" stroke-width="2.5"/><text x="330.0" y="747.125" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="330.0" dy="0">🟡 UTILIZAÇÃO CONDICIONADA — IA só em etapas</tspan><tspan x="330.0" dy="21.25">delimitadas, com validação crítica pelo autor e</tspan><tspan x="330.0" dy="21.25">declaração</tspan></text><line x1="330" y1="812" x2="330" y2="870" stroke="#14213D" stroke-width="3" marker-end="url(#seta)"/><rect x="40" y="870" width="820" height="250" rx="14" fill="#FFFFFF" stroke="#8A1220" stroke-width="2.5" stroke-dasharray="8 6"/><text x="60" y="906" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="60" dy="0">Em todas as modalidades, o docente:</tspan></text><text x="80" y="940" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="80" dy="0">• Explicita a modalidade no início da atividade e dos elementos de avaliação.</tspan></text><text x="80" y="971.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="80" dy="0">• Prevê uma alternativa equivalente quando o uso de IA é requisito (equidade).</tspan></text><text x="80" y="1002.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="80" dy="0">• Declara a sua própria utilização de IA em materiais, enunciados e feedback.</tspan></text><text x="80" y="1033.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="80" dy="0">• Mantém a decisão final de avaliação humana: a deteção automática nunca é prova</tspan><tspan x="80" dy="21.25">única.</tspan></text><text x="80" y="1086.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="80" dy="0">• Prevê um momento para o estudante explicitar o processo (discussão ou</tspan><tspan x="80" dy="21.25">apresentação).</tspan></text>
</svg>
