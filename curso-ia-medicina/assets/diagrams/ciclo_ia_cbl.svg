<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" role="img" aria-labelledby="t d" width="100%" preserveAspectRatio="xMidYMid meet">
<title id="t">Ciclo de integração IA–CBL</title>
<desc id="d">Cinco etapas em ciclo: pensar sem IA, consultar a IA, auditar, validar fontes e debrief do tutor, com o docente como mediador crítico no centro.</desc>
<defs><marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#14213D"/></marker></defs>
<rect width="900" height="940" fill="#FFFFFF"/>
<rect width="900" height="96" fill="#8A1220"/><text x="450.0" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="450.0" dy="0">Ciclo de integração IA–CBL</tspan></text><text x="450.0" y="76" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#F2C230" text-anchor="middle"><tspan x="450.0" dy="0">A IA entra depois do raciocínio humano e é sempre auditada</tspan></text><line x1="542" y1="302" x2="629" y2="365" stroke="#14213D" stroke-width="4" marker-end="url(#seta)"/><line x1="699" y1="499" x2="639" y2="684" stroke="#14213D" stroke-width="4" marker-end="url(#seta)"/><line x1="485" y1="751" x2="415" y2="751" stroke="#14213D" stroke-width="4" marker-end="url(#seta)"/><line x1="261" y1="684" x2="201" y2="499" stroke="#14213D" stroke-width="4" marker-end="url(#seta)"/><line x1="271" y1="365" x2="358" y2="302" stroke="#14213D" stroke-width="4" marker-end="url(#seta)"/><rect x="325" y="176" width="250" height="118" rx="16" fill="#F9D6D9" stroke="#14213D" stroke-width="2.5"/><circle cx="329" cy="180" r="18" fill="#14213D"/><text x="329" y="187" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="329" dy="0">1</tspan></text><text x="450" y="210" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="450" dy="0">Pensar sem IA</tspan></text><text x="450" y="234" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="450" dy="0">Hipóteses e plano iniciais,</tspan><tspan x="450" dy="18.75">por escrito, de cada</tspan><tspan x="450" dy="18.75">estudante.</tspan></text><rect x="596" y="373" width="250" height="118" rx="16" fill="#FFE9A8" stroke="#14213D" stroke-width="2.5"/><circle cx="600" cy="377" r="18" fill="#14213D"/><text x="600" y="384" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="600" dy="0">2</tspan></text><text x="721" y="407" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="721" dy="0">Consultar a IA</tspan></text><text x="721" y="431" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="721" dy="0">Doente simulado, hipóteses</tspan><tspan x="721" dy="18.75">alternativas, perguntas</tspan><tspan x="721" dy="18.75">socráticas.</tspan></text><rect x="493" y="692" width="250" height="118" rx="16" fill="#DDF3E4" stroke="#14213D" stroke-width="2.5"/><circle cx="497" cy="696" r="18" fill="#14213D"/><text x="497" y="703" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="497" dy="0">3</tspan></text><text x="618" y="726" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="618" dy="0">Auditar</tspan></text><text x="618" y="750" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="618" dy="0">Procurar alucinações, viés</tspan><tspan x="618" dy="18.75">e bajulação. Comparar com</tspan><tspan x="618" dy="18.75">as hipóteses de 1.</tspan></text><rect x="157" y="692" width="250" height="118" rx="16" fill="#FFE9A8" stroke="#14213D" stroke-width="2.5"/><circle cx="161" cy="696" r="18" fill="#14213D"/><text x="161" y="703" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="161" dy="0">4</tspan></text><text x="282" y="726" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="282" dy="0">Validar</tspan></text><text x="282" y="750" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="282" dy="0">Fontes primárias e normas</tspan><tspan x="282" dy="18.75">(DGS, guidelines). Registar</tspan><tspan x="282" dy="18.75">a verificação.</tspan></text><rect x="54" y="373" width="250" height="118" rx="16" fill="#F9D6D9" stroke="#14213D" stroke-width="2.5"/><circle cx="58" cy="377" r="18" fill="#14213D"/><text x="58" y="384" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="58" dy="0">5</tspan></text><text x="179" y="407" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="179" dy="0">Debrief do tutor</tspan></text><text x="179" y="431" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="179" dy="0">DEFT-AI: o que mudou no</tspan><tspan x="179" dy="18.75">raciocínio? Transferir sem</tspan><tspan x="179" dy="18.75">IA.</tspan></text><circle cx="450" cy="520" r="95" fill="#14213D"/><text x="450" y="508" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#F2C230" text-anchor="middle"><tspan x="450" dy="0">Docente</tspan></text><text x="450" y="534" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="450" dy="0">educator-in-the-loop</tspan></text><text x="450" y="556" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="450" dy="0">(mediador crítico)</tspan></text><text x="450.0" y="918" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="450.0" dy="0">Cada ciclo termina com nova pergunta clínica: o estudante consegue resolver sem IA?</tspan></text>
</svg>
