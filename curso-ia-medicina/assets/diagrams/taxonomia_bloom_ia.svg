<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 932" role="img" aria-labelledby="t d" width="100%" preserveAspectRatio="xMidYMid meet">
<title id="t">Taxonomia de Bloom e IA</title>
<desc id="d">Seis níveis da taxonomia de Bloom, do lembrar ao criar, com a forma como a IA pode apoiar cada um e o risco de atrofia se o estudante terceirizar o pensamento.</desc>
<defs><marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#14213D"/></marker></defs>
<rect width="900" height="932" fill="#FFFFFF"/>
<rect width="900" height="96" fill="#8A1220"/><text x="450.0" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="450.0" dy="0">Taxonomia de Bloom e IA</tspan></text><text x="450.0" y="76" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#F2C230" text-anchor="middle"><tspan x="450.0" dy="0">Onde a IA apoia a aprendizagem — e onde pode atrofiar a competência</tspan></text><text x="60" y="128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="60" dy="0">NÍVEL</tspan></text><text x="250" y="128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B5D2A" text-anchor="start"><tspan x="250" dy="0">COMO A IA PODE APOIAR (uso condicionado)</tspan></text><text x="580" y="128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="580" dy="0">RISCO DE ATROFIA (se terceirizado)</tspan></text><rect x="40" y="144" width="820" height="112" rx="12" fill="#FAD2D6" stroke="#14213D" stroke-width="2.5"/><text x="60" y="210" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="60" dy="0">Criar</tspan></text><line x1="238" y1="158" x2="238" y2="242" stroke="#14213D" stroke-width="2"/><text x="252" y="180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B5D2A" text-anchor="start"><tspan x="252" dy="0">✔ Gerar variações e rascunhos para</tspan><tspan x="252" dy="20.0">depois transformar</tspan></text><line x1="566" y1="158" x2="566" y2="242" stroke="#14213D" stroke-width="2"/><text x="580" y="180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="580" dy="0">✖ Incapacidade de produzir</tspan><tspan x="580" dy="20.0">trabalho original</tspan></text><rect x="50" y="266" width="800" height="112" rx="12" fill="#FFD9BC" stroke="#14213D" stroke-width="2.5"/><text x="70" y="332" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="70" dy="0">Avaliar</tspan></text><line x1="238" y1="280" x2="238" y2="364" stroke="#14213D" stroke-width="2"/><text x="252" y="302" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B5D2A" text-anchor="start"><tspan x="252" dy="0">✔ Fornecer contra-argumentos para</tspan><tspan x="252" dy="20.0">testar a decisão</tspan></text><line x1="566" y1="280" x2="566" y2="364" stroke="#14213D" stroke-width="2"/><text x="580" y="302" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="580" dy="0">✖ Incapacidade de justificar</tspan><tspan x="580" dy="20.0">uma decisão</tspan></text><rect x="60" y="388" width="780" height="112" rx="12" fill="#FFEFB0" stroke="#14213D" stroke-width="2.5"/><text x="80" y="454" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="80" dy="0">Analisar</tspan></text><line x1="238" y1="402" x2="238" y2="486" stroke="#14213D" stroke-width="2"/><text x="252" y="424" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B5D2A" text-anchor="start"><tspan x="252" dy="0">✔ Organizar dados e propor</tspan><tspan x="252" dy="20.0">estruturas de análise</tspan></text><line x1="566" y1="402" x2="566" y2="486" stroke="#14213D" stroke-width="2"/><text x="580" y="424" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="580" dy="0">✖ Não decompor a informação</tspan><tspan x="580" dy="20.0">para a examinar</tspan></text><rect x="70" y="510" width="760" height="112" rx="12" fill="#D5F0DD" stroke="#14213D" stroke-width="2.5"/><text x="90" y="576" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="90" dy="0">Aplicar</tspan></text><line x1="238" y1="524" x2="238" y2="608" stroke="#14213D" stroke-width="2"/><text x="252" y="546" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B5D2A" text-anchor="start"><tspan x="252" dy="0">✔ Simular casos novos e doentes</tspan><tspan x="252" dy="20.0">virtuais</tspan></text><line x1="566" y1="524" x2="566" y2="608" stroke="#14213D" stroke-width="2"/><text x="580" y="546" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="580" dy="0">✖ Não usar o conhecimento</tspan><tspan x="580" dy="20.0">em situações novas</tspan></text><rect x="80" y="632" width="740" height="112" rx="12" fill="#CFE4FA" stroke="#14213D" stroke-width="2.5"/><text x="100" y="698" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="100" dy="0">Compreender</tspan></text><line x1="238" y1="646" x2="238" y2="730" stroke="#14213D" stroke-width="2"/><text x="252" y="668" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B5D2A" text-anchor="start"><tspan x="252" dy="0">✔ Explicar de várias formas;</tspan><tspan x="252" dy="20.0">perguntas socráticas</tspan></text><line x1="566" y1="646" x2="566" y2="730" stroke="#14213D" stroke-width="2"/><text x="580" y="668" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="580" dy="0">✖ Incapacidade de</tspan><tspan x="580" dy="20.0">articular conceitos</tspan></text><rect x="90" y="754" width="720" height="112" rx="12" fill="#DCDDF8" stroke="#14213D" stroke-width="2.5"/><text x="110" y="820" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="110" dy="0">Lembrar</tspan></text><line x1="238" y1="768" x2="238" y2="852" stroke="#14213D" stroke-width="2"/><text x="252" y="790" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B5D2A" text-anchor="start"><tspan x="252" dy="0">✔ Gerar quizzes e espaçamento de</tspan><tspan x="252" dy="20.0">revisão</tspan></text><line x1="566" y1="768" x2="566" y2="852" stroke="#14213D" stroke-width="2"/><text x="580" y="790" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="580" dy="0">✖ Desconhecimento dos</tspan><tspan x="580" dy="20.0">factos de base</tspan></text><text x="450.0" y="898" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="450.0" dy="0">Regra de ouro: pensar primeiro, consultar a IA depois, auditar sempre.</tspan></text>
</svg>
