sans-serif" font-size="19" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="515.0" dy="0">Médio</tspan></text><text x="745.0" y="630" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="745.0" dy="0">Alto</tspan></text><text x="515.0" y="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8A1220" text-anchor="middle"><tspan x="515.0" dy="0">IMPACTO →</tspan></text><text transform="translate(40 375.0) rotate(-90)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8A1220" text-anchor="middle">PROBABILIDADE →</text><circle cx="670" cy="350" r="24" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/><text x="670" y="358" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="670" dy="0">1</tspan></text><circle cx="670" cy="200" r="24" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/><text x="670" y="208" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="670" dy="0">2</tspan></text><circle cx="440" cy="200" r="24" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/><text x="440" y="208" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="440" dy="0">3</tspan></text><circle cx="732" cy="350" r="24" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/><text x="732" y="358" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="732" dy="0">4</tspan></text><circle cx="440" cy="350" r="24" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/><text x="440" y="358" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="440" dy="0">5</tspan></text><circle cx="502" cy="350" r="24" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/><text x="502" y="358" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="502" dy="0">6</tspan></text><circle cx="210" cy="350" r="24" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/><text x="210" y="358" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="210" dy="0">7</tspan></text><circle cx="210" cy="200" r="24" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/><text x="210" y="208" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="210" dy="0">8</tspan></text><text x="40" y="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#8A1220" text-anchor="start"><tspan x="40" dy="0">Legenda e medidas de mitigação</tspan></text><circle cx="62" cy="734" r="16" fill="#14213D"/><text x="62" y="740" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="62" dy="0">1</tspan></text><text x="92" y="732" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Fuga de dados de doentes para ferramentas públicas</tspan></text><text x="92" y="754.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Mitigação: Ferramentas institucionais; anonimização; formação RGPD.</tspan></text><circle cx="62" cy="808.75" r="16" fill="#14213D"/><text x="62" y="814.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="62" dy="0">2</tspan></text><text x="92" y="806.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Alucinação aceite como facto (citações, normas)</tspan></text><text x="92" y="828.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Mitigação: Auditoria e validação cruzada em fontes primárias.</tspan></text><circle cx="62" cy="883.5" r="16" fill="#14213D"/><text x="62" y="889.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="62" dy="0">3</tspan></text><text x="92" y="881.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Viés de automação / dependência epistémica</tspan></text><text x="92" y="903.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Mitigação: Raciocinar antes da IA; sondar com DEFT-AI.</tspan></text><circle cx="62" cy="958.25" r="16" fill="#14213D"/><text x="62" y="964.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="62" dy="0">4</tspan></text><text x="92" y="956.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Atrofia do raciocínio clínico (deskilling / never-skilling)</tspan></text><text x="92" y="978.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Mitigação: Tarefas sem IA, avaliação oral e transferência.</tspan></text><circle cx="62" cy="1033.0" r="16" fill="#14213D"/><text x="62" y="1039.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="62" dy="0">5</tspan></text><text x="92" y="1031.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Viés algorítmico e iniquidade nos resultados</tspan></text><text x="92" y="1053.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Mitigação: Rever dados de origem; exigir equidade e explicabilidade.</tspan></text><circle cx="62" cy="1107.75" r="16" fill="#14213D"/><text x="62" y="1113.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="62" dy="0">6</tspan></text><text x="92" y="1105.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Deteção automática de IA usada como prova única</tspan></text><text x="92" y="1127.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Mitigação: Múltiplas evidências; conversa com o estudante.</tspan></text><circle cx="62" cy="1182.5" r="16" fill="#14213D"/><text x="62" y="1188.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="62" dy="0">7</tspan></text><text x="92" y="1180.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Autoria ou uso de IA não declarado</tspan></text><text x="92" y="1202.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Mitigação: Modelo de declaração; modalidade explícita.</tspan></text><circle cx="62" cy="1257.25" r="16" fill="#14213D"/><text x="62" y="1263.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="62" dy="0">8</tspan></text><text x="92" y="1255.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Desigualdade de acesso e literacia</tspan></text><text x="92" y="1277.25" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="92" dy="0">Mitigação: Acesso institucional; alternativas equivalentes.</tspan></text>
</svg>
