<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1170" role="img" aria-labelledby="t d" width="100%" preserveAspectRatio="xMidYMid meet">
<title id="t">Comparação entre LLM e raciocínio clínico humano</title>
<desc id="d">Tabela de seis dimensões — fonte do conhecimento, mecanismo, contexto do doente, incerteza, resposta ao utilizador e responsabilidade — comparando um modelo de linguagem com o médico ou estudante.</desc>
<defs><marker id="seta" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#14213D"/></marker></defs>
<rect width="900" height="1170" fill="#FFFFFF"/>
<rect width="900" height="96" fill="#8A1220"/><text x="450.0" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="450.0" dy="0">LLM vs raciocínio clínico humano</tspan></text><text x="450.0" y="76" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#F2C230" text-anchor="middle"><tspan x="450.0" dy="0">Duas formas muito diferentes de produzir uma resposta</tspan></text><rect x="40" y="120" width="200" height="50" rx="8" fill="#14213D" stroke="#14213D" stroke-width="2.5"/><text x="140.0" y="151.375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="140.0" dy="0">Dimensão</tspan></text><rect x="250" y="120" width="320" height="50" rx="8" fill="#8A1220" stroke="#8A1220" stroke-width="2.5"/><text x="410.0" y="151.375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="410.0" dy="0">Modelo de linguagem (LLM)</tspan></text><rect x="580" y="120" width="280" height="50" rx="8" fill="#0B5D2A" stroke="#0B5D2A" stroke-width="2.5"/><text x="720.0" y="151.375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="720.0" dy="0">Médico / estudante</tspan></text><rect x="40" y="182" width="200" height="138" rx="8" fill="#E9E6DD" stroke="#14213D" stroke-width="2.5"/><text x="140.0" y="246.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="140.0" dy="0">Fonte do</tspan><tspan x="140.0" dy="21.25">«conhecimento»</tspan></text><rect x="250" y="182" width="320" height="138" rx="8" fill="#F9D6D9" stroke="#8A1220" stroke-width="2.5"/><text x="410.0" y="237.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="410.0" dy="0">Padrões estatísticos de texto de</tspan><tspan x="410.0" dy="20.0">treino (sem verificação factual</tspan><tspan x="410.0" dy="20.0">por defeito)</tspan></text><rect x="580" y="182" width="280" height="138" rx="8" fill="#DDF3E4" stroke="#0B5D2A" stroke-width="2.5"/><text x="720.0" y="237.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="720.0" dy="0">Conhecimento estruturado,</tspan><tspan x="720.0" dy="20.0">experiência clínica, doente</tspan><tspan x="720.0" dy="20.0">real e guidelines</tspan></text><rect x="40" y="330" width="200" height="138" rx="8" fill="#E9E6DD" stroke="#14213D" stroke-width="2.5"/><text x="140.0" y="405.375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="140.0" dy="0">Mecanismo</tspan></text><rect x="250" y="330" width="320" height="138" rx="8" fill="#F9D6D9" stroke="#8A1220" stroke-width="2.5"/><text x="410.0" y="395.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="410.0" dy="0">Prevê a palavra (token) seguinte</tspan><tspan x="410.0" dy="20.0">mais provável</tspan></text><rect x="580" y="330" width="280" height="138" rx="8" fill="#DDF3E4" stroke="#0B5D2A" stroke-width="2.5"/><text x="720.0" y="385.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="720.0" dy="0">Hipóteses dedutivas e</tspan><tspan x="720.0" dy="20.0">indutivas, reconhecimento de</tspan><tspan x="720.0" dy="20.0">padrões e análise</tspan></text><rect x="40" y="478" width="200" height="138" rx="8" fill="#E9E6DD" stroke="#14213D" stroke-width="2.5"/><text x="140.0" y="553.375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="140.0" dy="0">Contexto do doente</tspan></text><rect x="250" y="478" width="320" height="138" rx="8" fill="#F9D6D9" stroke="#8A1220" stroke-width="2.5"/><text x="410.0" y="543.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="410.0" dy="0">Só o que está no prompt; omissões</tspan><tspan x="410.0" dy="20.0">levam a respostas incompletas</tspan></text><rect x="580" y="478" width="280" height="138" rx="8" fill="#DDF3E4" stroke="#0B5D2A" stroke-width="2.5"/><text x="720.0" y="533.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="720.0" dy="0">Observa, examina, pergunta,</tspan><tspan x="720.0" dy="20.0">perceciona o não-verbal e o</tspan><tspan x="720.0" dy="20.0">contexto social</tspan></text><rect x="40" y="626" width="200" height="138" rx="8" fill="#E9E6DD" stroke="#14213D" stroke-width="2.5"/><text x="140.0" y="701.375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="140.0" dy="0">Incerteza</tspan></text><rect x="250" y="626" width="320" height="138" rx="8" fill="#F9D6D9" stroke="#8A1220" stroke-width="2.5"/><text x="410.0" y="691.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="410.0" dy="0">Tom confiante mesmo quando erra;</tspan><tspan x="410.0" dy="20.0">pode fabricar fontes</tspan></text><rect x="580" y="626" width="280" height="138" rx="8" fill="#DDF3E4" stroke="#0B5D2A" stroke-width="2.5"/><text x="720.0" y="681.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="720.0" dy="0">Reconhece o que não sabe;</tspan><tspan x="720.0" dy="20.0">pede segunda opinião; tolera</tspan><tspan x="720.0" dy="20.0">a incerteza</tspan></text><rect x="40" y="774" width="200" height="138" rx="8" fill="#E9E6DD" stroke="#14213D" stroke-width="2.5"/><text x="140.0" y="838.75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="140.0" dy="0">Resposta ao</tspan><tspan x="140.0" dy="21.25">utilizador</tspan></text><rect x="250" y="774" width="320" height="138" rx="8" fill="#F9D6D9" stroke="#8A1220" stroke-width="2.5"/><text x="410.0" y="839.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="410.0" dy="0">Tende a concordar (bajulação) e</tspan><tspan x="410.0" dy="20.0">depende do prompt</tspan></text><rect x="580" y="774" width="280" height="138" rx="8" fill="#DDF3E4" stroke="#0B5D2A" stroke-width="2.5"/><text x="720.0" y="839.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="720.0" dy="0">Responde perante o doente e a</tspan><tspan x="720.0" dy="20.0">deontologia</tspan></text><rect x="40" y="922" width="200" height="138" rx="8" fill="#E9E6DD" stroke="#14213D" stroke-width="2.5"/><text x="140.0" y="997.375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="140.0" dy="0">Responsabilidade</tspan></text><rect x="250" y="922" width="320" height="138" rx="8" fill="#F9D6D9" stroke="#8A1220" stroke-width="2.5"/><text x="410.0" y="987.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="410.0" dy="0">Nenhuma (sem personalidade</tspan><tspan x="410.0" dy="20.0">jurídica)</tspan></text><rect x="580" y="922" width="280" height="138" rx="8" fill="#DDF3E4" stroke="#0B5D2A" stroke-width="2.5"/><text x="720.0" y="987.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="720.0" dy="0">Total: ética, legal e</tspan><tspan x="720.0" dy="20.0">profissional</tspan></text><rect x="40" y="1074" width="820" height="76" rx="14" fill="#F2C230" stroke="#14213D" stroke-width="2.5"/><text x="450.0" y="1107.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="450.0" dy="0">Implicação pedagógica: a IA pode ser um bom interlocutor, mas nunca o juiz final.</tspan><tspan x="450.0" dy="22.5">A supervisão humana é a salvaguarda.</tspan></text>
</svg>
